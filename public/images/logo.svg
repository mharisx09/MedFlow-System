<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <title>Med Flow System logo</title>
  <!-- MF monogram -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Navy M -->
    <path d="M 250 440 L 250 225 L 342 348 L 434 225 L 434 440"
          stroke="#0A5596" stroke-width="66"/>
    <!-- Teal F: top wing -->
    <path d="M 452 232 C 545 200, 615 200, 688 224"
          stroke="#119B9B" stroke-width="54"/>
    <!-- Teal F: middle swoosh -->
    <path d="M 285 478 C 405 478, 475 388, 648 366"
          stroke="#119B9B" stroke-width="50"/>
    <!-- Teal F: right stem -->
    <path d="M 588 392 L 588 502"
          stroke="#119B9B" stroke-width="54"/>
    <!-- Medical cross -->
    <path d="M 648 478 L 712 478 M 680 446 L 680 510"
          stroke="#119B9B" stroke-width="27"/>
  </g>
  <!-- Wordmark -->
  <text x="400" y="648" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="108" letter-spacing="6"><tspan fill="#0A5596">MED </tspan><tspan fill="#119B9B">FLOW</tspan></text>
  <text x="414" y="716" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="500"
        font-size="50" letter-spacing="28" fill="#4A5568">SYSTEM</text>
</svg>
